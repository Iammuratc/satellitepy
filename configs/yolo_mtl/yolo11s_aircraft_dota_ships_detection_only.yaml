# Conditional two-family detector. Each dataset supervises only its complete
# geometry branch; all three datasets share the YOLO11 backbone and FPN.
model:
  weights: yolo11s-obb.pt
  input_channels: 4
  geometry_tasks: [obboxes]
  geometry_families: [aircraft, ship]
  dataset_geometry_families:
    fineair: aircraft
    rareplanes: aircraft
    dota_ships: ship
  geometry_loss_weights: {aircraft: 1.0, ship: 1.0}

tasks: {}

train:
  image_size: 1024
  rgb_ir_channel_dropout: 0.25
  batch_size: 8
  epochs: 100
  learning_rate: 0.0002
  weight_decay: 0.0005
  workers: 8
  dataset_sampling: balanced
  validation_interval: 1
  early_stopping_patience: 15
  early_stopping_min_delta: 0.0001
  early_stopping_metric: mean_map50_95
  map: {confidence: 0.001, nms_iou: 0.7, max_detections: 1000}
