# DOTA/Potsdam partial-mask experiment corresponding to IGARSS 2025 Sec. IV-B.
model:
  weights: yolo11s-obb.pt
  input_channels: 3
  geometry_tasks: [obboxes]
  geometry_loss_weights:
    obboxes: 1.0

tasks:
  coarse-class:
    kind: classification
    loss_weight: 1.0
  masks:
    kind: segmentation
    loss_weight: 1.0

train:
  image_size: 1024
  rgb_ir_channel_dropout: 0.0
  batch_size: 8
  epochs: 40
  learning_rate: 0.0002
  weight_decay: 0.0005
  workers: 8
  validation_interval: 1
  # Normalize each supervised task by an EMA of its own training magnitude.
  # Static loss weights above remain available for deliberate task emphasis.
  loss_balance:
    mode: ema
    momentum: 0.98
    target: 1.0
    min_scale: 0.05
    max_scale: 100.0
  early_stopping_patience: 10
  early_stopping_min_delta: 0.001
